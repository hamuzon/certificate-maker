<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found - Certificate Maker</title>
  <meta name="robots" content="noindex, follow">
  <style>
    body {
      margin: 0;
      font-family: "Yu Gothic", "游ゴシック", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
      background-color: #fef9ef;
      color: #4a3728;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      padding: 20px;
    }
    .error-code {
      font-size: 4rem;
      font-weight: 700;
      color: #d4a373;
      margin: 0 0 10px;
    }
    p {
      font-size: 1.2rem;
      margin: 10px 0;
      color: #8b6f50;
    }
    p.en {
      font-size: 1rem;
      color: #a08878;
    }
    .divider {
      width: 60px;
      height: 2px;
      background-color: #e0d0c0;
      margin: 16px auto;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background-color: #d4a373;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      transition: background-color 0.2s, transform 0.12s, box-shadow 0.12s;
      font-weight: 600;
    }
    a:hover {
      background-color: #c4925e;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(180, 130, 80, 0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <p>ページが見つかりませんでした。</p>
    <p class="en">The page you are looking for may have been moved or deleted, or the URL may be incorrect.</p>
    <div class="divider"></div>
    <a href="/">トップページへ戻る / Back to Home</a>
  </div>
</body>
</html>
